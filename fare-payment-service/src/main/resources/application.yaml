server:
  port: 8084

spring:
  application:
    name: fare-payment-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/ridelink_payments}
  data:
    mongodb:
      auto-index-creation: true    # makes the unique rideId index work (one payment per ride)

app:
  jwt:
    secret: ${JWT_SECRET}                        # same secret as every other service
  internal:
    service-key: ${INTERNAL_SERVICE_KEY}         # checked on /internal/** (calls from Ride)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

